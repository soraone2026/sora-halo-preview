<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>奧蕾莉亞・城市</title>
  <link rel="icon" href="data:,">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="city.css">
  <script src="playtest-api.js"></script>
  <script src="i18n.js"></script>
  <script src="fin-save.js"></script>
  <script type="module" src="city.js"></script>
</head>
<body>
  <div id="stage"></div>
  <header class="hud">
    <a class="btn" id="back" href="/study">‹ 書房</a>
    <button class="btn" id="homeBtn" type="button" hidden>🏠 回家</button>
    <div class="card">
      <strong id="place">奧蕾莉亞・小鎮</strong>
      <span id="clock" class="muted"></span>
    </div>
    <span class="spacer"></span>
    <button class="btn" id="snd" type="button" title="背景聲（風、雨、軌道）">🔇</button>
    <button class="btn gems" id="gems" type="button" title="寶石收藏">💎 0</button>
    <span class="btn coin" id="coins">B –</span>
  </header>
  <div class="actions">
    <button class="btn primary" id="ride" type="button">🎫 買車票搭捷運進城（3 B）</button>
    <button class="btn" id="view" type="button" hidden>👀 看車外</button>
    <button class="btn" id="skipRide" type="button" hidden>⏩ 略過</button>
  </div>
  <p id="loading" class="loading">城市載入中…</p>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
